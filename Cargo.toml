[package]
name = "kalendar"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
chrono-tz = "0.10"
image = { version = "0.25", default-features = false, features = ["png"] }
roxmltree = "0.21.2"
keyring-core = "1.0.1"
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }
sha2 = "0.11"

[profile.dev]
opt-level = 1
