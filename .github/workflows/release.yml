# Builds Katlendar for Linux, Windows and macOS and publishes a GitHub
# release when a version tag is pushed:
#
#   git tag -a v0.1.0-beta.1 -m "Katlendar 0.1.0-beta.1"
#   git push origin v0.1.0-beta.1
#
# The tag must match `version` in Cargo.toml. A tag with a pre-release part
# (v0.2.0-beta.1, v1.0.0-rc.1) is published as a pre-release.
#
# It can also be run by hand from the Actions tab to try the builds; that
# run uploads the packages as workflow artifacts and publishes nothing.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-22.04 # an older glibc, so the binary runs on more distributions
            kind: linux
          - name: Windows x86_64
            os: windows-latest
            kind: windows
          - name: macOS universal
            os: macos-latest
            kind: macos
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: ver
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.kind == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.kind }}

      - name: Test
        if: matrix.kind == 'linux'
        run: cargo test --release

      # ---- Linux: .tar.gz and .deb ----
      - name: Build (Linux)
        if: matrix.kind == 'linux'
        run: cargo build --release --locked

      - uses: taiki-e/install-action@v2
        if: matrix.kind == 'linux'
        with:
          tool: cargo-deb

      - name: Package (Linux)
        if: matrix.kind == 'linux'
        run: |
          v=${{ steps.ver.outputs.version }}
          name=katlendar-$v-linux-x86_64
          mkdir -p dist "$name"
          cp target/release/katlendar packaging/linux/katlendar.desktop README.md LICENSE "$name/"
          cp assets/icon.png "$name/katlendar.png"
          tar -czf "dist/$name.tar.gz" "$name"
          cargo deb --no-build --no-strip --output "dist/katlendar_${v}_amd64.deb"

      # ---- Windows: .zip ----
      - name: Build (Windows)
        if: matrix.kind == 'windows'
        run: cargo build --release --locked

      - name: Package (Windows)
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $name = "katlendar-$v-windows-x86_64"
          New-Item -ItemType Directory -Force -Path dist, $name | Out-Null
          Copy-Item target/release/katlendar.exe, README.md, LICENSE -Destination $name
          Compress-Archive -Path $name -DestinationPath "dist/$name.zip"

      # ---- macOS: universal .app in a .dmg ----
      - name: Build (macOS)
        if: matrix.kind == 'macos'
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      - name: Package (macOS)
        if: matrix.kind == 'macos'
        run: |
          v=${{ steps.ver.outputs.version }}
          app=dist/Katlendar.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -create -output "$app/Contents/MacOS/katlendar" \
            target/aarch64-apple-darwin/release/katlendar \
            target/x86_64-apple-darwin/release/katlendar
          sed -e "s/@VERSION@/$v/" -e "s/@SHORT_VERSION@/${v%%-*}/" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          # the icon, in every size macOS asks for
          iconset=$RUNNER_TEMP/katlendar.iconset
          mkdir -p "$iconset"
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/icon.png --out "$iconset/icon_${s}x${s}.png" >/dev/null
            d=$((s * 2)); [ $d -le 512 ] && sips -z $d $d assets/icon.png --out "$iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/katlendar.icns"
          # not notarised: an ad-hoc signature only, so it runs on Apple silicon
          codesign --force --deep --sign - "$app"
          staging=$RUNNER_TEMP/dmg
          mkdir -p "$staging"
          cp -R "$app" "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "Katlendar $v" -srcfolder "$staging" -ov -format UDZO "dist/katlendar-$v-macos-universal.dmg"
          rm -rf "$app"

      - uses: actions/upload-artifact@v4
        with:
          name: katlendar-${{ matrix.kind }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          name: Katlendar ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: dist/*
