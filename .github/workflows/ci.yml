# Tests on Linux and makes sure the Windows and macOS builds still compile,
# so a release tag does not find out first.

name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["site/**", "docs/**", "**.md"]
  pull_request:
    paths-ignore: ["site/**", "docs/**", "**.md"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        if: runner.os == 'Linux'
        run: cargo test --locked
      - name: Check
        if: runner.os != 'Linux'
        run: cargo check --locked
